name: UI geometry review
on:
  push:
    branches: [fix/overview-snr-geometry]
    paths: [.github/workflows/ui-geometry-review.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-snr-geometry
      - name: Apply hash-checked source changes
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, json
          parts = [Path(f'.github/ui-geometry-delta.{i}.b64').read_text().strip() for i in range(1,5)]
          raw = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a1ac84fb7e58933f840085ed469ab642406970a90d51c0f9c0979425728c9284'
          records = json.loads(raw)
          for item in records:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              if item['before'] is None:
                  assert not path.exists(), str(path)
              else:
                  assert hashlib.sha256(old).hexdigest() == item['before'], str(path)
              lines = old.decode('utf-8').splitlines(True)
              for first, last, replacement in reversed(item['edits']):
                  lines[first:last] = [replacement]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
              print('Verified:', path)
          Path('review-changed-paths.txt').write_text('\n'.join(i['path'] for i in records)+'\n')
      - name: Apply review refinements
        run: python .github/refine-ui-geometry.py
      - name: Separate functional GUI checks from optional screenshot export
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/smoke_test_interfaces.m')
          s=p.read_text(encoding='utf-8')
          s=s.replace('function smoke_test_interfaces(outputDir)','function smoke_test_interfaces(outputDir, exportImages)',1)
          s=s.replace('% Does not call any hardware/CLI commands. Requires a MATLAB desktop graphics\n% stack and Signal Processing Toolbox for the legacy overview RD calculation.', '% Does not call any hardware/CLI commands. Signal Processing Toolbox is\n% needed for the legacy overview RD calculation. Set exportImages=false in\n% headless CI; screenshot export requires a desktop graphics stack.',1)
          s=s.replace("    if nargin < 1, outputDir = fullfile(tempdir,'radar-ui-smoke'); end", "    if nargin < 1, outputDir = fullfile(tempdir,'radar-ui-smoke'); end\n    if nargin < 2, exportImages = true; end",1)
          s=s.replace("    exportapp(app.UIFigure,fullfile(outputDir,'interface1.png'));", "    if exportImages\n        exportapp(app.UIFigure,fullfile(outputDir,'interface1.png'));\n    end",1)
          s=s.replace("    exportapp(win.UIFigure,fullfile(outputDir,'interface2.png'));", "    if exportImages\n        exportapp(win.UIFigure,fullfile(outputDir,'interface2.png'));\n    end\n    feval(win.RunButton.ButtonPushedFcn,win.RunButton,[]);\n    assert(startsWith(win.StatusLabel.Text,'处理完成'), ...\n        'Detailed processing did not complete: %s',win.StatusLabel.Text);\n    assert(strcmp(win.ExportButton.Enable,'on'));\n    fid = fopen(fullfile(outputDir,'ui-smoke-passed.txt'),'w');\n    assert(fid >= 0);\n    fprintf(fid,'PASS: overview load/SNR, frame handoff, geometry and speed setting retention, detailed processing.\\n');\n    fclose(fid);",1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Check whitespace
        run: git diff --check
      - name: Install UI fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Signal_Processing_Toolbox
      - name: MATLAB unit regression
        uses: matlab-actions/run-command@v3
        with:
          command: startup; mkdir('test-results'); suite = testsuite('tests','IncludeSubfolders',true); runner = matlab.unittest.TestRunner.withTextOutput; runner.addPlugin(matlab.unittest.plugins.XMLPlugin.producingJUnitFormat('test-results/junit.xml')); results = runner.run(suite); save('test-results/results.mat','results'); assertSuccess(results);
      - name: Offline GUI functional smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: startup; addpath('scripts'); smoke_test_interfaces('ui-smoke',false);
      - name: Commit tested source only and remove staging helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < review-changed-paths.txt
          git rm .github/ui-geometry-delta.*.b64 .github/refine-ui-geometry.py .github/workflows/ui-geometry-review.yml
          git diff --cached --check
          git commit -m 'fix: separate overview SNR and geometry-aware detailed velocity analysis'
          git push origin HEAD:fix/overview-snr-geometry
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-geometry-test-evidence
          path: |
            test-results/
            ui-smoke/
          retention-days: 7
